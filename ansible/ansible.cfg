[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
display_args_to_stdout = False
interpreter_python = /usr/bin/python3
forks = 2
timeout = 20

[ssh_connection]
ssh_args = -o ControlMaster=no -o ControlPath=none -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes
pipelining = True
