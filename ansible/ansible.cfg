# Общие настройки контроллера Ansible. Wrapper scripts/ansible.sh явно выбирает этот файл:
# на WSL DrvFS автоматический поиск cfg может быть отключён из-за прав каталога.
[defaults]
# Рабочий inventory локальный и исключён из Git; для bootstrap передают другой через -i.
inventory = inventory/hosts.yml
# Запись роли в roles: ищет здесь её tasks/main.yml; handlers подключаются самой ролью.
roles_path = roles
# Проверяем ключ сервера по known_hosts, а не принимаем незнакомый сервер автоматически.
host_key_checking = True
# Не создаём retry-файлы и не печатаем аргументы задач, где могут быть чувствительные данные.
retry_files_enabled = False
display_args_to_stdout = False
# Это Python внутри управляемой VM, а не Python venv управляющего WSL.
interpreter_python = /usr/bin/python3
# Два гостя могут обрабатываться параллельно; reboot.yml дополнительно ограничивает serial.
forks = 2
timeout = 20

[ssh_connection]
# Каждое подключение новое: старый multiplexed SSH-сеанс не доказывает новую политику доступа.
# IdentitiesOnly использует выбранный ключ, keepalive помогает обнаружить оборванное соединение.
ssh_args = -o ControlMaster=no -o ControlPath=none -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o IdentitiesOnly=yes
# Меньше промежуточных копирований модулей по SSH; права по-прежнему задаются become в play.
pipelining = True
