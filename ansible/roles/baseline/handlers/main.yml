---
# Handlers вызываются через notify при изменении файлов; flush_handlers может вызвать их раньше конца play.
- name: Reload systemd for access guard
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart bounded journal
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

# Reload перечитывает проверенную политику без намеренного разрыва текущего SSH.
- name: Reload verified SSH policy
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
