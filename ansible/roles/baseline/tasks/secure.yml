---
- name: Require an already verified VPN connection and console recovery
  ansible.builtin.assert:
    that:
      - lab_vpn_verified | bool
      - lab_console_recovery_verified | bool
      - ansible_user == lab_admin_user
      - ansible_host == (lab_hub_wg_ip if inventory_hostname in groups.get('monitoring', []) else lab_web_wg_ip)
    fail_msg: Secured phase must use a new labadmin VPN connection after independent VPN and console checks.

- name: Check whether the SSH policy would change
  ansible.builtin.template:
    src: ssh-policy.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ozzylogik.conf
    owner: root
    group: root
    mode: '0600'
  check_mode: true
  diff: false
  register: lab_ssh_policy_candidate

- name: Guard the previous SSH/WireGuard/firewall configuration
  ansible.builtin.command:
    argv: [/usr/local/sbin/ozzylogik-access-guard, arm]
  register: lab_ssh_guard
  changed_when: "lab_ssh_guard.stdout == 'armed'"
  when:
    - lab_ssh_policy_candidate.changed
    - not ansible_check_mode

- name: Install and verify the effective SSH policy
  block:
    - name: Install SSH policy without reloading an unvalidated configuration
      ansible.builtin.template:
        src: ssh-policy.conf.j2
        dest: /etc/ssh/sshd_config.d/00-ozzylogik.conf
        owner: root
        group: root
        mode: '0600'
        validate: /usr/sbin/sshd -t -f %s
      diff: false
      notify: Reload verified SSH policy

    - name: Validate the complete SSH configuration including other includes
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -t]
      changed_when: false
      when: not ansible_check_mode

    - name: Inspect effective SSH settings for admin and root VPN contexts
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - "user={{ item }},addr={{ lab_admin_wg_ip }},host=lab-controller,laddr={{ lab_hub_wg_ip if inventory_hostname in groups.get('monitoring', []) else lab_web_wg_ip }},lport=22"
      loop: ['{{ lab_admin_user }}', root]
      register: lab_effective_sshd
      changed_when: false
      when: not ansible_check_mode

    - name: Reject conflicting SSH Match or earlier configuration
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in item.stdout_lines"
          - "'passwordauthentication no' in item.stdout_lines"
          - "'kbdinteractiveauthentication no' in item.stdout_lines"
          - "'pubkeyauthentication yes' in item.stdout_lines"
          - "'authenticationmethods publickey' in item.stdout_lines"
          - "('allowusers ' ~ lab_admin_user) in item.stdout_lines"
        fail_msg: Effective SSH policy differs from the required key-only non-root policy; rollback is required.
      loop: '{{ lab_effective_sshd.results | default([]) }}'
      loop_control:
        label: '{{ item.item }}'
      when: not ansible_check_mode

    - name: Activate only the verified policy while rollback remains armed
      ansible.builtin.meta: flush_handlers
  rescue:
    - name: Restore the saved guest access configuration immediately
      ansible.builtin.command:
        argv: [/usr/local/sbin/ozzylogik-access-guard, rollback]
      changed_when: true
      when: not ansible_check_mode
    - name: Stop after failed SSH validation
      ansible.builtin.fail:
        msg: SSH validation failed; the guest rollback was requested. Inspect console and guard status before retrying.
