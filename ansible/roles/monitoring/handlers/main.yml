---
# notify выполняет handler лишь при изменении конфигурации/артефакта; несколько уведомлений
# одного handler объединяются до следующего flush_handlers или конца play.
- name: Restart Loki
  # Unit Loki создаётся ролью вручную: daemon_reload перечитывает его перед restart.
  ansible.builtin.systemd_service:
    name: loki
    state: restarted
    daemon_reload: true

- name: Restart Grafana
  # Grafana использует службу из .deb; restart загружает её конфигурацию/provisioning.
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
