---
# Этот список задач подключается из tasks/main.yml роли monitoring через import_tasks.
# Он выполняется на ubu2: dest ниже — путь на VM, а не в рабочей папке Ansible.
# copy берёт готовый src из каталога files этой роли; переменные в JSON не подставляет.
# Provider объясняет Grafana, где искать dashboard JSON и можно ли сохранять UI-правки.
# Конкретные разрешения задаются в files/ozzylogik-dashboards.yml, а не в этой задаче.
# owner/group/mode задают владельца и права файлов Linux; 0640 = запись root, чтение группе.
# notify ставит Restart Grafana в очередь только при изменении соответствующего файла.
# flush_handlers немедленно выполняет уже поставленные в очередь обработчики.
# validate проверяет JSON до замены файла; uri в конце ожидает готовность самой Grafana.
# Проверка health не выполняет запросы всех панелей и не проверяет VPN со стороны клиента.
- name: Prepare the provisioned dashboard directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards/ozzylogik
    state: directory
    owner: root
    group: grafana
    mode: '0750'

- name: Provision the Web and WAF dashboard
  ansible.builtin.copy:
    src: ozzylogik-web-waf.json
    dest: /var/lib/grafana/dashboards/ozzylogik/ozzylogik-web-waf.json
    owner: root
    group: grafana
    mode: '0640'
    validate: /usr/bin/python3 -m json.tool %s
  notify: Restart Grafana

- name: Register the OZZYLOGIK dashboard provider
  ansible.builtin.copy:
    src: ozzylogik-dashboards.yml
    dest: /etc/grafana/provisioning/dashboards/ozzylogik.yml
    owner: root
    group: grafana
    mode: '0640'
  notify: Restart Grafana

- name: Load the dashboard provider before its health check
  ansible.builtin.meta: flush_handlers

- name: Wait for Grafana after provisioning the dashboard
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/api/health
    status_code: 200
  register: lab_dashboard_health
  retries: 20
  delay: 2
  until: lab_dashboard_health.status == 200
