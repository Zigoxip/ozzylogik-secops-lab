---
# Задачи идут сверху вниз. assert останавливает применение, если входные данные
# не соответствуют проверенному дизайну; ОС/архитектура взяты из gathered facts.
- name: Validate WAF platform and immutable image input
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.architecture == 'x86_64'
      - lab_docker_package_version | length > 0
      - "lab_web_image is match('^owasp/modsecurity-crs:[^@]+@sha256:[a-f0-9]{64}$')"
      - lab_web_http_port | int == 80
      - lab_web_bind_address == '0.0.0.0'
      - lab_web_log_rotate_count | int > 1
    fail_msg: "Pin the real docker.io apt candidate in lab_docker_package_version before deployment; this role expects the approved amd64 host-network HTTP/80 design."

- name: Install the pinned Docker package and host log rotation support
  # apt приводит пакеты к нужному состоянию. policy_rc_d: 101 запрещает пакету
  # автоматически запустить daemon до установки нашей конфигурации.
  ansible.builtin.apt:
    name:
      - "{{ lab_docker_package }}={{ lab_docker_package_version }}"
      - python3-requests
      - logrotate
    state: present
    update_cache: true
    cache_valid_time: 3600
    allow_downgrade: false
    policy_rc_d: 101

- name: Prepare configuration for the dedicated host-network Docker daemon
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Disable unused bridge networking and Docker forwarding changes
  # copy с content создаёт файл прямо из YAML. validate проверяет временную копию
  # перед заменой рабочей; notify вызовет handler только при изменении содержимого.
  # Эти daemon-настройки подходят выделенному host-network WAF, не любому Docker-хосту.
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "bridge": "none",
        "iptables": false,
        "ip6tables": false,
        "ip-forward": false,
        "ip-masq": false
      }
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/dockerd --validate --config-file %s
  notify: Restart dedicated Docker daemon

- name: Apply Docker networking policy before reconciling the WAF container
  # Обычно handlers ждут конца play; здесь их нужно применить раньше запуска контейнера.
  ansible.builtin.meta: flush_handlers

- name: Enable Docker on the dedicated web VM
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Create the shared read-only log access group
  # Единый GID согласует права host-файлов с отдельным пользователем сборщика Alloy.
  ansible.builtin.group:
    name: "{{ lab_log_group }}"
    gid: "{{ lab_log_group_gid }}"
    system: true
    state: present

- name: Create WAF configuration and static content directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0755"
    state: directory
  loop:
    - "{{ lab_web_config_dir }}"
    - "{{ lab_web_site_dir }}"
    - /var/log/ozzylogik

- name: Preserve the private parent directory shared with the access guard
  ansible.builtin.file:
    path: /var/lib/ozzylogik
    owner: root
    group: root
    mode: '0700'
    state: directory

- name: Create the log directory readable by the collector
  ansible.builtin.file:
    path: "{{ lab_web_log_dir }}"
    owner: "{{ lab_web_nginx_uid }}"
    group: "{{ lab_log_group }}"
    mode: "0750"
    state: directory

- name: Create log files without truncating existing records
  # file/state: touch создаёт отсутствующий файл, не стирая содержимое существующего.
  # preserve не меняет времена при каждом прогоне и помогает сохранить changed=0.
  ansible.builtin.file:
    path: "{{ lab_web_log_dir }}/{{ item }}"
    owner: "{{ lab_web_nginx_uid }}"
    group: "{{ lab_log_group }}"
    mode: "0640"
    state: touch
    access_time: preserve
    modification_time: preserve
  loop:
    - access.jsonl
    - audit.jsonl
    - error.log

- name: Install the Nginx static WAF configuration
  # template читает src из templates/ этой роли на контроллере, подставляет переменные
  # Jinja и записывает результат в dest на VM. В контейнер попадёт уже готовый файл.
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ lab_web_config_dir }}/nginx.conf.template"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the WAF container

- name: Install the lab demonstration page
  # Статика подключена в контейнер каталогом: изменение HTML видно без restart Nginx.
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ lab_web_site_dir }}/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Install the static health-check resource
  ansible.builtin.copy:
    content: "ok\n"
    dest: "{{ lab_web_site_dir }}/healthz"
    owner: root
    group: root
    mode: "0644"

- name: Pull the immutable official OWASP CRS image
  # Модуль community.docker общается с локальным Docker socket НА VM.
  # pull: not_present не загружает уже имеющийся закреплённый образ повторно.
  community.docker.docker_image_pull:
    docker_host: unix:///var/run/docker.sock
    name: "{{ lab_web_image }}"
    platform: linux/amd64
    pull: not_present

- name: Verify the pinned image nginx worker UID
  # Короткий контейнер без сети проверяет UID из образа. Это проверка, а не изменение
  # целевого состояния, поэтому changed_when: false; следующий assert сверяет права логов.
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - --host=unix:///var/run/docker.sock
      - run
      - --rm
      - --network=none
      - --entrypoint=/usr/bin/id
      - "{{ lab_web_image }}"
      - -u
      - nginx
  register: lab_web_image_uid
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Confirm host log ownership matches the pinned image
  ansible.builtin.assert:
    that:
      - lab_web_image_uid.stdout | trim | int == lab_web_nginx_uid | int
  when: not ansible_check_mode

- name: Start Nginx with ModSecurity and OWASP CRS
  # docker_container описывает желаемое состояние целиком: образ, сеть, mounts и лимиты.
  # host network сохраняет путь через INPUT гостевого firewall; published ports не нужны.
  community.docker.docker_container:
    docker_host: unix:///var/run/docker.sock
    name: "{{ lab_web_container_name }}"
    image: "{{ lab_web_image }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    user: "0:0"
    # Master связывает порт 80, затем Nginx workers переходят к пользователю nginx.
    # Сбрасываем все capabilities и возвращаем только необходимые этому образу.
    # Master binds HTTP/80; nginx workers drop to their unprivileged image user.
    cap_drop:
      - ALL
    capabilities:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opts:
      - no-new-privileges:true
    memory: "{{ lab_web_memory }}"
    cpus: "{{ lab_web_cpus }}"
    pids_limit: 128
    log_driver: local
    log_options:
      max-size: 10m
      max-file: "3"
    env:
      # Переменные образа включают блокировку и JSON audit. RelevantOnly не означает,
      # что каждая audit-запись является блокировкой: бывают и неблокирующие предупреждения.
      # The upstream low-port preflight reads these unused default-template ports.
      # Our full nginx.conf template is the sole listener authority (HTTP/80).
      PORT: "8080"
      SSL_PORT: "8443"
      NGINX_WORKER_PROCESSES: "1"
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG_PARTS: ABFHZ
      MODSEC_AUDIT_LOG: "{{ lab_web_log_dir }}/audit.jsonl"
      MODSEC_AUDIT_LOG_RELEVANT_STATUS: "^(?:5|4(?!04))"
      MODSEC_DEBUG_LOGLEVEL: "0"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
    volumes:
      # Слева путь на VM, справа путь в контейнере. ro — только чтение; rw нужен логам.
      - "{{ lab_web_config_dir }}/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro"
      - "{{ lab_web_site_dir }}:/srv/ozzylogik/site:ro"
      - "{{ lab_web_log_dir }}:{{ lab_web_log_dir }}:rw"
    healthcheck:
      # Проверяем именно наш реальный HTTP/80, а не неиспользуемые порты образа по умолчанию.
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "3"
        - "http://127.0.0.1:{{ lab_web_http_port }}/healthz"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

- name: Install graceful log reopen helper
  # Историческое имя задачи сохранено: фактически helper кратко перезапускает WAF,
  # потому что HUP в закреплённой сборке не переоткрывает serial audit-файл ModSecurity.
  ansible.builtin.template:
    src: reopen-waf-logs.sh.j2
    dest: /usr/local/sbin/ozzylogik-reopen-waf-logs
    owner: root
    group: root
    mode: "0750"
  tags: [waf_log_rotation]

- name: Install dedicated WAF log rotation policy
  # Ротация по rename/create сохраняет читаемый Alloy старый открытый файл; copytruncate
  # не используется. Число архивов/размер и расписание заданы отдельными настройками.
  ansible.builtin.template:
    src: logrotate.conf.j2
    dest: "{{ lab_web_config_dir }}/logrotate.conf"
    owner: root
    group: root
    mode: "0644"
  tags: [waf_log_rotation]

- name: Install the WAF log rotation service
  ansible.builtin.template:
    src: logrotate.service.j2
    dest: /etc/systemd/system/ozzylogik-waf-logrotate.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload WAF log rotation units
  tags: [waf_log_rotation]

- name: Install the WAF log rotation timer
  # Timer каждые пять минут запускает oneshot service, который вызывает logrotate.
  # Сам timer ничего не удаляет и не гарантирует жёсткий предел размера между проверками.
  ansible.builtin.copy:
    dest: /etc/systemd/system/ozzylogik-waf-logrotate.timer
    content: |
      [Unit]
      Description=Check OZZYLOGIK WAF log rotation every five minutes
      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=5min
      Persistent=true
      [Install]
      WantedBy=timers.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload WAF log rotation units
  tags: [waf_log_rotation]

- name: Enable WAF log rotation checks
  ansible.builtin.systemd_service:
    name: ozzylogik-waf-logrotate.timer
    daemon_reload: true
    enabled: true
    state: started
  tags: [waf_log_rotation]

- name: Apply WAF configuration handlers before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Inspect the declared WAF container after handlers
  # Успех создания контейнера ещё не доказывает правильность runtime: ниже отдельно
  # проверяются сеть/mounts/образ, синтаксис Nginx и реальный ответ health endpoint.
  community.docker.docker_container_info:
    docker_host: unix:///var/run/docker.sock
    name: '{{ lab_web_container_name }}'
  register: lab_web_runtime
  when: not ansible_check_mode

- name: Require host networking and all three declared mounts after handlers
  ansible.builtin.assert:
    that:
      - lab_web_runtime.exists
      - lab_web_runtime.container.HostConfig.NetworkMode == 'host'
      - lab_web_runtime.container.HostConfig.PortBindings | default({}, true) == {}
      - lab_web_runtime.container.Mounts | length == 3
      - lab_web_runtime.container.Config.Image == lab_web_image
    fail_msg: The running WAF container differs from the declared network, mounts or image.
    quiet: true
  when: not ansible_check_mode

- name: Validate the running Nginx configuration
  ansible.builtin.command:
    argv: [/usr/bin/docker, --host=unix:///var/run/docker.sock, exec, '{{ lab_web_container_name }}', nginx, -t]
  changed_when: false
  when: not ansible_check_mode

- name: Wait for the local WAF health resource
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ lab_web_http_port }}/healthz'
    status_code: 200
  register: lab_web_ready
  retries: 20
  delay: 3
  until: lab_web_ready.status == 200
  when: not ansible_check_mode
